vulnerabilities:
  # brace-expansion and picomatch below are inside npm's own bundled
  # node_modules (/usr/local/lib/node_modules/npm/). They cannot be
  # resolved via package.json overrides; a fix requires the base image
  # to ship a newer npm version.

  - id: CVE-2026-111997
    paths:
      - usr/local/lib/node_modules/npm/node_modules/ip-address/package.json
    reason: >
      Vulnerable ip-address is bundled inside npm itself, not the
      application. Cannot be upgraded via package.json overrides; npm 12.2.1
      (current latest) still bundles ip-address 10.7.2, so a fix requires the
      base image to ship a newer npm version.

  - id: CVE-2026-109869
    paths:
      - usr/local/lib/node_modules/npm/node_modules/undici/package.json
    reason: >
      Vulnerable undici is bundled inside npm itself, not the
      application. Cannot be upgraded via package.json overrides.

  - id: CVE-2026-109924
    paths:
      - usr/local/lib/node_modules/npm/node_modules/undici/package.json
    reason: >
      Vulnerable undici is bundled inside npm itself, not the
      application. Cannot be upgraded via package.json overrides.
